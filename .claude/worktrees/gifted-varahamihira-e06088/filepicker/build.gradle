apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

version = "2.2.5"

android {

    namespace = "droidninja.filepicker"

    compileSdk 35
    buildToolsVersion = '35.0.0'

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName version
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation  'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
//    api 'com.github.bumptech.glide:glide:5.0.5'
//    kapt 'com.github.bumptech.glide:compiler:5.0.5'
    implementation('com.github.bumptech.glide:glide:5.0.5') {
        exclude group: 'com.github.bumptech.glide', module: 'animated-gif'
        exclude group: 'com.github.bumptech.glide', module: 'animated-webp'
        exclude group: 'com.github.bumptech.glide', module: 'webpdecoder'
    }
    kapt 'com.github.bumptech.glide:compiler:5.0.5'

    testImplementation 'junit:junit:4.13.2'
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0') {
        because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
    }
}

group = "com.droidninja"                                          // Maven Group ID for the artifact

tasks.register('javadoc', Javadoc) {
    excludes = ['**/*.kt']
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
}

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

// https://github.com/bintray/gradle-bintray-plugin
repositories {
    mavenCentral()
}